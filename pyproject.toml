[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coord-mcp"
version = "0.2.0"
description = "Typed task board for Claude Code agent teams: contracts, decisions, intents."
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
test = ["pytest>=8", "mcp>=2.0,<3"]  # smoke_stdio.py drives the server with the SDK client

[project.scripts]
coord-mcp = "coord_mcp.server:main"

[tool.setuptools.packages.find]
include = ["coord_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
